name: CI-1

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Run tests
        run: npm test


  build_job:
    needs: lint_and_test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: build
        run: npm run build


  deploy:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "Deploying application..."
          sleep 3
          echo "Deployment completed"


  print_var:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Print variables
        run: |
          echo "Repository name: ${{ github.repository }}"
          echo "Branch name: ${{ github.ref_name }}"
          echo "Workflow name: ${{ github.workflow }}"
          echo "Actor username: ${{ github.actor }}"
